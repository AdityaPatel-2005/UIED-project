<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Log In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h2 class="login-title">Log In</h2>
        
        <div class="login-wrapper">
            <div class="login-card">
                
                
                
                <div class="form-group">
                    <br><br><br>
                    <label class="form-label">Phone Number</label>
                    <div class="phone-input-container">
                        <svg class="phone-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                        <input type="tel" class="login-input" placeholder="">
                    </div>
                </div>
<br><br><br>
                <div class="form-group">
                    <label class="form-label">OTP</label>
                    <div class="otp-grid">
                        <div class="otp-box-wrapper">
                            <input type="text" class="otp-input" maxlength="1" autocomplete="off">
                            <div class="otp-line"></div>
                        </div>
                        <div class="otp-box-wrapper">
                            <input type="text" class="otp-input" maxlength="1" autocomplete="off">
                            <div class="otp-line"></div>
                        </div>
                        <div class="otp-box-wrapper">
                            <input type="text" class="otp-input" maxlength="1" autocomplete="off">
                            <div class="otp-line"></div>
                        </div>
                        <div class="otp-box-wrapper">
                            <input type="text" class="otp-input" maxlength="1" autocomplete="off">
                            <div class="otp-line"></div>
                        </div>
                    </div>
                </div>

                <button class="login-action-btn" onclick="window.location.href='index.html'">LOG IN</button>

            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const otpInputs = document.querySelectorAll('.otp-input');
            
            otpInputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    const line = input.nextElementSibling;
                    
                    // Hide the white line if a number is entered
                    if(input.value.length > 0) {
                        line.style.opacity = '0';
                        // Auto-focus next input box
                        if(index < otpInputs.length - 1) {
                            otpInputs[index + 1].focus();
                        }
                    } else {
                        // Show line if empty
                        line.style.opacity = '1';
                    }
                });

                // Auto-focus previous input box on backspace
                input.addEventListener('keydown', (e) => {
                    if(e.key === 'Backspace' && input.value === '' && index > 0) {
                        otpInputs[index - 1].focus();
                    }
                });
            });
        });
    </script>
</body>
</html>
