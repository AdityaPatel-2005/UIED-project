<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doctor Strange - Mobile Ticket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <header class="seats-header">
            <a href="seats.html" class="icon-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </a>
            <h2>Mobile Ticket</h2>
            <button class="icon-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            </button>
        </header>

        <p class="ticket-instruction">Once you buy a movie ticket simply scan the barcode to acces your movie.</p>

        <div class="ticket-carousel">
            <div class="ticket-bg-card left-bg"></div>
            <div class="ticket-bg-card right-bg"></div>

            <div class="ticket-wrapper">
                <div class="ticket-main">
                    <div class="ticket-top"></div>
                    <div class="ticket-divider"></div>
                    <div class="ticket-bottom">
                        <div class="ticket-details-grid">
                            <div>
                                <div class="ticket-label">Date:</div>
                                <div class="ticket-value" id="t-date">October 8</div>
                            </div>
                            <div>
                                <div class="ticket-label">Time:</div>
                                <div class="ticket-value" id="t-time">7 p.m.</div>
                            </div>
                            <div>
                                <div class="ticket-label">Row:</div>
                                <div class="ticket-value" id="t-row">2</div>
                            </div>
                            <div>
                                <div class="ticket-label">Seats:</div>
                                <div class="ticket-value" id="t-seats">9, 10</div>
                            </div>
                        </div>

                        <div class="barcode">
                            <svg width="100%" height="45" preserveAspectRatio="none">
                                <rect x="0%" y="0" width="3%" height="45" fill="black" />
                                <rect x="5%" y="0" width="1%" height="45" fill="black" />
                                <rect x="8%" y="0" width="5%" height="45" fill="black" />
                                <rect x="15%" y="0" width="2%" height="45" fill="black" />
                                <rect x="19%" y="0" width="1%" height="45" fill="black" />
                                <rect x="22%" y="0" width="6%" height="45" fill="black" />
                                <rect x="30%" y="0" width="2%" height="45" fill="black" />
                                <rect x="34%" y="0" width="4%" height="45" fill="black" />
                                <rect x="40%" y="0" width="1%" height="45" fill="black" />
                                <rect x="43%" y="0" width="7%" height="45" fill="black" />
                                <rect x="52%" y="0" width="2%" height="45" fill="black" />
                                <rect x="56%" y="0" width="1%" height="45" fill="black" />
                                <rect x="59%" y="0" width="5%" height="45" fill="black" />
                                <rect x="66%" y="0" width="3%" height="45" fill="black" />
                                <rect x="71%" y="0" width="1%" height="45" fill="black" />
                                <rect x="74%" y="0" width="6%" height="45" fill="black" />
                                <rect x="82%" y="0" width="2%" height="45" fill="black" />
                                <rect x="86%" y="0" width="4%" height="45" fill="black" />
                                <rect x="92%" y="0" width="1%" height="45" fill="black" />
                                <rect x="95%" y="0" width="5%" height="45" fill="black" />
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>



        <nav class="bottom-nav">
            <div class="nav-item">
                <a href="index.html">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M10 20V14H14V20H19V12H22L12 3L2 12H5V20H10Z"/></svg>
                </a>
            </div>
            
            <div class="nav-item active-nav">
                <div class="home-circlebg"></div>
                <a href="tickets.html" class="home-circle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M22 10V6C22 4.9 21.1 4 20 4H4C2.9 4 2.01 4.9 2.01 6V10C3.11 10 4 10.9 4 12C4 13.1 3.11 14 2.01 14V18C2.01 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V14C20.9 14 20 13.1 20 12C20 10.9 22 10Z"/></svg>
                </a>
            </div>

            <div class="nav-item"><a href="info.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M4 4H10V10H4V4ZM14 4H20V10H14V4ZM4 14H10V20H4V14ZM14 14H20V20H14V14Z"/></svg></a></div>
            <div class="nav-item"><a href="profile.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z"/></svg></a></div>
        </nav>
        <div class="home-indicator"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const storedDateRaw = localStorage.getItem('movieDate') || 'April 23, 2022';
            const storedTime = localStorage.getItem('movieTime') || '7 p.m.';
            const storedSeats = localStorage.getItem('selectedSeats') || '9, 10';

            let finalDate = storedDateRaw;
            if (storedDateRaw.includes(',')) {
                finalDate = storedDateRaw.split(',')[0];
            }

            document.getElementById('t-date').innerText = finalDate;
            document.getElementById('t-time').innerText = storedTime;
            document.getElementById('t-seats').innerText = storedSeats;
        });
    </script>
</body>
</html>
